# “projects” content type — edit the fields below.
# See the YAML cheat sheet under the editor for the available field types.
kind: collection
hasBody: true
fields:
  title:
    type: text
    required: true
  date:
    type: datetime
    required: true
    label: Published
  description:
    type: multiline
    label: Summary
  thumbnail:
    type: image
    label: Thumbnail
  embedded-page:
    type: embed
    label: Page to embed
  embed-mode:
    type: enum
    label: How to open it
    options: [inline, newtab]
  keywords:
    type: tags
    label: Keywords

