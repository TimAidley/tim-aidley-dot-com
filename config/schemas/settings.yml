# Site-wide settings — the Timber equivalent of Hugo's `[params]` block in hugo.toml.
# `page: false` marks this as the config singleton: it is read into `{{ site }}` but
# never rendered as a page of its own.
#
# The default theme's colour/font knobs (accentColor, bodyFont, contentWidth, …) are
# deliberately absent: the anatole theme ships its own light/dark palette and type
# scale, so those settings would have had no effect.
kind: singleton
page: false
hasBody: false
fields:
  title:
    type: text
  description:
    type: multiline
    label: Sidebar bio
  author:
    type: text
  baseUrl:
    type: text
  homepage:
    type: reference
    referenceType: pages
  activeTheme:
    type: text
    label: Active theme
  profilePicture:
    type: image
    label: Profile picture
  profilePictureAlt:
    type: text
    label: Profile picture alt text
    # Describes the photo for screen readers and for anyone whose images don't load.
    # anatole hardcoded "profile picture", which tells a listener nothing; the template
    # falls back to the author's name when this is empty.
  copyright:
    type: multiline
    label: Copyright line
    # Hugo embedded a `{{ YEAR }}` placeholder here; the footer template now prepends the
    # build year itself, so this holds just the text that follows it.
  contentRatio:
    type: number
    label: Content column ratio
    min: 0.5
    max: 0.9
  # Social links. Hugo stored these as a repeating `[[params.socialIcons]]` array, but
  # Timber's v1 field vocabulary has no list-of-objects kind, so each link is its own
  # field. The sidebar renders only the ones that are filled in.
  bluesky:
    type: text
    label: Bluesky URL
  mastodon:
    type: text
    label: Mastodon URL
  github:
    type: text
    label: GitHub URL
  linkedin:
    type: text
    label: LinkedIn URL
  email:
    type: text
    label: Email address
